  expected_platform: linux/amd64
  inspected_at_utc: 2026-07-19T01:29:42Z
  inspected_by: local-podman-manifest-and-image-inspect
  version: "44.20260718.0"

disk_image_builder:
  upstream_repository: https://github.com/osbuild/image-builder
  image_reference: ghcr.io/osbuild/image-builder-cli@sha256:700368cfa3e78b25fb4fe02a87cedf1a5bc0cb142d7287c8c6fff72fd09228f5
  digest: sha256:700368cfa3e78b25fb4fe02a87cedf1a5bc0cb142d7287c8c6fff72fd09228f5
