# This is a declaration template, not an executable build input.
schema_version: 1
status: approved-for-explicit-phase-0-experiment

build_gate:
  enabled: true
  reason: >-
    The Fedora base and unified Image Builder CLI are locally present as
    verified linux/amd64 immutable digests. Every state-changing invocation
    remains subject to explicit human approval and workspace path validation.
  required_before_enabling:
    - Complete: record and verify a complete base OCI digest for linux/amd64.
    - Complete: update the identical immutable base reference in system/Containerfile.
    - Complete: record and verify a complete unified Image Builder digest and version.
    - Complete: review the builder invocation, mount allowlist, and output paths.
    - Per build: create a build-ID-specific evidence manifest before reporting success.

target:
  architecture: x86_64
  firmware: uefi
  profile: minimal-vm
  graphical_session: false

base_image:
  registry_repository: quay.io/fedora/fedora-bootc
  tag: "44"
  digest: sha256:86cd97f1e7962e30f52f35ae1c0719299df4f681492b133ea4bcdb74d154fb92
