  unified_image_builder:
    immutable_reference: ghcr.io/osbuild/image-builder-cli@sha256:700368cfa3e78b25fb4fe02a87cedf1a5bc0cb142d7287c8c6fff72fd09228f5
    platform: linux/amd64
