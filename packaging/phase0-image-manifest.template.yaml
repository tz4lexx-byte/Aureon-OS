    revision: 08ccdf050b4a5b190f0c500122e6c5763e56ccd8
    supports_bootc_ref: true
    selected_for_phase0_experiment: true

guest_overlay:
  source: system/overlays
  readiness_unit: aureon-phase0-ready.service
  readiness_marker: AUREON_PHASE0_READY
  serial_kernel_arguments:
    - console=tty0
    - console=ttyS0,115200n8
  shutdown_unit: aureon-phase0-shutdown.service
  shutdown_after_readiness: true
  contains_users: false
  contains_passwords: false
  contains_ssh_keys: false
  contains_network_configuration: false

planned_conversion:
  input: exact-derived-oci-image-digest
  output_type: qcow2
  root_filesystem: ext4
  root_filesystem_reason: explicit-conservative-phase-0-default
  image_size_bytes: 10737418240

artifact_layout:
  build_manifest: build/<build-id>/manifest.json
  derived_oci_store: /var/lib/aureon-phase0-podman/storage (Ubuntu WSL only)
  derived_oci_evidence: build/<build-id>/derived-oci.json
  conversion_output: images/<build-id>/
  qcow2_base: images/<build-id>/aureon-base.qcow2
  qcow2_overlay: work/qemu/<build-id>/smoke-overlay.qcow2
  serial_log: work/qemu/<build-id>/serial.log

storage_policy:
  allow_only_virtual_artifacts: true
  workspace_artifacts_only: true
  allowed_wsl_builder_paths:
    - /var/lib/aureon-phase0-podman/storage
    - /run/aureon-phase0-podman
  conversion_container_mounts:
    - source: /var/lib/aureon-phase0-podman/storage
      destination: /var/lib/aureon-phase0-podman/storage
      access: rw
      purpose: preserve the dedicated store's libpod static path for nested Podman
    - source: /var/lib/aureon-phase0-podman/storage
      destination: /var/lib/containers/storage
      access: rw
      purpose: let Image Builder's containers-storage manifest reader resolve the same dedicated OCI
    - source: packaging/phase0-container-storage.conf
      destination: /etc/containers/storage.conf
      access: ro
    - source: packaging/phase0-containers.conf
      destination: /etc/containers/containers.conf
      access: ro
  physical_block_devices: forbidden
  forbidden_path_patterns:
    - /dev/sd*
    - /dev/vd*
    - /dev/nvme*
    - /dev/disk/*
  qemu_base_disk_mode: read-only
  qemu_writable_state: build-id-specific-qcow2-overlay
  host_mounts_into_guest: forbidden
  converter_network_first_attempt: disabled
  nested_builder_storage_configuration: packaging/phase0-container-storage.conf
  nested_builder_containers_configuration: packaging/phase0-containers.conf
  guest_network_default: disabled
  secrets_in_image_or_vm: forbidden

evidence_required:
  - resolved base OCI digest
  - resolved derived OCI digest
  - resolved disk-image-builder digest and version
  - checksum of generated qcow2
  - exact QEMU configuration
  - complete serial log
  - readiness marker result
  - clean shutdown result
