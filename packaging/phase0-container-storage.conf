# Explicit rootful Podman storage for the nested Image Builder CLI.
# The host-side dedicated store is mounted at the identical absolute path inside
# the builder container; keeping paths identical prevents libpod database
# configuration mismatches and avoids use of the global Podman store.
[storage]
driver = "overlay"
runroot = "/run/aureon-phase0-podman"
graphroot = "/var/lib/aureon-phase0-podman/storage"

[storage.options]
mount_program = ""
