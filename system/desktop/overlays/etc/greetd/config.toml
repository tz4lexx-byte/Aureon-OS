# Disposable local session used only by the Aureon QEMU desktop preview.
# The guest has no virtual NIC.

[terminal]
vt = 1

[default_session]
command = "agreety --cmd '/usr/libexec/aureon/aureon-plasma-session'"
user = "greetd"

[initial_session]
command = "/usr/libexec/aureon/aureon-plasma-session"
user = "aureon"
